name: webOS static validation

on:
  push:
    branches:
      - armoniztech/hydra-ui
  pull_request:
    branches:
      - armoniztech/hydra-ui
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find webos/fidelity/js webos/services -type f -name '*.js' -print0)
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find webos/fidelity/js webos/services -type f -name '*.mjs' -print0)
      - name: Check package versions and protected playback contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('webos/fidelity/appinfo.json', 'utf8'));
          const service = JSON.parse(fs.readFileSync('webos/services/com.webosflux.xuptertv.fidelity.service/package.json', 'utf8'));
          if (app.version !== service.version) {
            throw new Error('App/service version mismatch: ' + app.version + ' / ' + service.version);
          }
          console.log('Version OK:', app.version);
          NODE
          grep -Fq "params.forceRelay ? 'resolveSmooth' : 'resolve'" webos/fidelity/js/app.js
          grep -Fq "portalServiceCall(resolveMethod" webos/fidelity/js/app.js
          grep -Fq "resolveSmooth" webos/services/com.webosflux.xuptertv.fidelity.service/index.js
          grep -Fq "relay.register" webos/services/com.webosflux.xuptertv.fidelity.service/index.js
          grep -Fq "resolveHostIp" webos/services/com.webosflux.xuptertv.fidelity.service/proxy.js
          grep -Fq "cachefly.net" webos/services/com.webosflux.xuptertv.fidelity.service/proxy.js
          grep -Fq "var pending = PROVIDERS.length" webos/services/com.webosflux.xuptertv.fidelity.service/dnsx.js
          grep -Fq "PROVIDERS.forEach" webos/services/com.webosflux.xuptertv.fidelity.service/dnsx.js
          grep -Fq "pointermove" webos/fidelity/js/app.js
          grep -Fq "mousemove" webos/fidelity/js/app.js
          grep -Fq "document.addEventListener('keydown', handleKey" webos/fidelity/js/app.js
          grep -Fq "function moveFocus" webos/fidelity/js/app.js
          grep -Fq "function isAdultCatalogItem" webos/fidelity/js/app.js
          grep -Fq "function isAdultLiveChannel" webos/fidelity/js/app.js
          grep -Fq "function renderLiveSearchResults" webos/fidelity/js/app.js
          grep -Fq "state.searchScope === 'live'" webos/fidelity/js/app.js
          grep -Fq "function buildParentPanel" webos/fidelity/js/app.js
          grep -Fq "function buildHistoryPanel" webos/fidelity/js/app.js
          grep -Fq "function buildUpgradePanel" webos/fidelity/js/app.js
          grep -Fq "function checkHydraUpdate" webos/fidelity/js/app.js
          grep -Fq "state.settingsReturn" webos/fidelity/js/app.js
          grep -Fq "function buildProviderExperience" webos/fidelity/js/app.js
          grep -Fq "function refreshExploreProviders" webos/fidelity/js/app.js
          for provider in netflix prime disney max apple hulu paramount; do
            grep -Fq "id: '$provider'" webos/fidelity/js/app.js
          done
          for feature in playerSeek resumePlayerPlayback togglePlayerPlayPause advanceToNextEpisode loadSubtitleTrack switchAudioTrack restartCurrentPlayback; do
            grep -Fq "function $feature" webos/fidelity/js/app.js
          done
          archive=tools/vendor/ffmpeg-7.0.2-armhf-static.tar.xz
          echo "7D41F558CB1F3395B313F8CEABED78B3731C79A0962ABF405EBB5CD393E93991  $archive" | sha256sum -c -
          tmp="$(mktemp -d)"
          tar -xJf "$archive" -C "$tmp" ffmpeg-7.0.2-armhf-static/ffmpeg
          bin="$tmp/ffmpeg-7.0.2-armhf-static/ffmpeg"
          echo "0AFBA4A11110E6E402053E0FC14C33A7EB207D7A588688AE87DBA471A0F06C71  $bin" | sha256sum -c -
          chmod 755 "$bin"
          test -x "$bin"
          echo "Playback/DoH contract and FFmpeg archive integrity OK"
